<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link
  rel="stylesheet"
  href="{{ url_for('static', filename='style.css') }}"
>
</head>
<body>
<div class="container">

    <h1>Neural Network Playground</h1>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="28" height="28"></canvas>
    </div>

    <div class="controls">
        <button id="clearBtn">Clear</button>
    </div>

</div>

<div class="prediction-panel">

    <div class="digit-display">
        <span id="mainPrediction">0</span>
    </div>

    <div class="probability-container">

        <div class="probability-card">
            <div class="label">0</div>
            <div class="bar">
                <div class="fill" id="fill0"></div>
            </div>
            <div class="percent" id="text0">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">1</div>
            <div class="bar">
                <div class="fill" id="fill1"></div>
            </div>
            <div class="percent" id="text1">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">2</div>
            <div class="bar">
                <div class="fill" id="fill2"></div>
            </div>
            <div class="percent" id="text2">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">3</div>
            <div class="bar">
                <div class="fill" id="fill3"></div>
            </div>
            <div class="percent" id="text3">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">4</div>
            <div class="bar">
                <div class="fill" id="fill4"></div>
            </div>
            <div class="percent" id="text4">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">5</div>
            <div class="bar">
                <div class="fill" id="fill5"></div>
            </div>
            <div class="percent" id="text5">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">6</div>
            <div class="bar">
                <div class="fill" id="fill6"></div>
            </div>
            <div class="percent" id="text6">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">7</div>
            <div class="bar">
                <div class="fill" id="fill7"></div>
            </div>
            <div class="percent" id="text7">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">8</div>
            <div class="bar">
                <div class="fill" id="fill8"></div>
            </div>
            <div class="percent" id="text8">0%</div>
        </div>

        <div class="probability-card">
            <div class="label">9</div>
            <div class="bar">
                <div class="fill" id="fill9"></div>
            </div>
            <div class="percent" id="text9">0%</div>
        </div>

    </div>

</div>
  
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
